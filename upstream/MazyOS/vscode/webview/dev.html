<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MazyOS (pré-visualização)</title>
    <!--
      Pré-visualização da interface no navegador, sem o editor.
      Rode `node esbuild.mjs` na pasta vscode/ e abra este arquivo.
      Parâmetros: ?view=painel|console  &cenario=normal|vazio|nao-instalado|verificando
                  &tema=escuro|claro|contraste  &largura=280  &exec=<id>
    -->
    <style>
      /* Valores aproximados dos temas Dark Modern, Light Modern e High Contrast do VS Code */
      html.vscode-dark {
        --vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --vscode-font-size: 13px;
        --vscode-editor-font-family: Menlo, Monaco, 'Courier New', monospace;
        --vscode-sideBar-background: #181818;
        --vscode-editor-background: #1f1f1f;
        --vscode-foreground: #cccccc;
        --vscode-descriptionForeground: #9d9d9d;
        --vscode-widget-border: #313131;
        --vscode-focusBorder: #0078d4;
        --vscode-input-background: #313131;
        --vscode-input-border: #3c3c3c;
        --vscode-input-foreground: #cccccc;
        --vscode-input-placeholderForeground: #989898;
        --vscode-button-secondaryBackground: #313131;
        --vscode-button-secondaryForeground: #cccccc;
        --vscode-button-secondaryHoverBackground: #3c3c3c;
        --vscode-textLink-foreground: #4daafc;
        --vscode-textLink-activeForeground: #4daafc;
        --vscode-errorForeground: #f85149;
        --vscode-toolbar-hoverBackground: #5a5d5e50;
        --vscode-notifications-background: #1f1f1f;
        --vscode-notifications-foreground: #cccccc;
        --vscode-notifications-border: #2b2b2b;
        --vscode-menu-background: #1f1f1f;
        --vscode-menu-foreground: #cccccc;
        --vscode-menu-border: #454545;
        --vscode-menu-selectionBackground: #0078d4;
        --vscode-menu-selectionForeground: #ffffff;
      }
      html.vscode-light {
        --vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --vscode-font-size: 13px;
        --vscode-editor-font-family: Menlo, Monaco, 'Courier New', monospace;
        --vscode-sideBar-background: #f8f8f8;
        --vscode-editor-background: #ffffff;
        --vscode-foreground: #3b3b3b;
        --vscode-descriptionForeground: #6b6b6b;
        --vscode-widget-border: #e5e5e5;
        --vscode-focusBorder: #005fb8;
        --vscode-input-background: #ffffff;
        --vscode-input-border: #cecece;
        --vscode-input-foreground: #3b3b3b;
        --vscode-input-placeholderForeground: #767676;
        --vscode-button-secondaryBackground: #e5e5e5;
        --vscode-button-secondaryForeground: #3b3b3b;
        --vscode-button-secondaryHoverBackground: #cccccc;
        --vscode-textLink-foreground: #005fb8;
        --vscode-textLink-activeForeground: #005fb8;
        --vscode-errorForeground: #c72e0f;
        --vscode-toolbar-hoverBackground: #b8b8b850;
        --vscode-notifications-background: #ffffff;
        --vscode-notifications-foreground: #3b3b3b;
        --vscode-notifications-border: #e5e5e5;
        --vscode-menu-background: #ffffff;
        --vscode-menu-foreground: #3b3b3b;
        --vscode-menu-border: #cecece;
        --vscode-menu-selectionBackground: #005fb8;
        --vscode-menu-selectionForeground: #ffffff;
      }
      html.vscode-high-contrast {
        --vscode-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --vscode-font-size: 13px;
        --vscode-editor-font-family: Menlo, Monaco, 'Courier New', monospace;
        --vscode-sideBar-background: #000000;
        --vscode-editor-background: #000000;
        --vscode-foreground: #ffffff;
        --vscode-descriptionForeground: #ffffffcc;
        --vscode-contrastBorder: #6fc3df;
        --vscode-focusBorder: #f38518;
        --vscode-input-background: #000000;
        --vscode-input-border: #6fc3df;
        --vscode-errorForeground: #f48771;
      }
      /* Moldura que imita a barra lateral */
      html.mz-dev-moldura body {
        margin: 0 auto;
        border-inline: 1px solid #8884;
      }
    </style>
    <script>
      ;(function () {
        var p = new URLSearchParams(location.search)
        var view = p.get('view') === 'console' ? 'console' : 'painel'
        window.mazyos = { view: view, execucaoId: p.get('exec') || undefined }
        var tema = p.get('tema')
        var classe = tema === 'claro' ? 'vscode-light' : tema === 'contraste' ? 'vscode-high-contrast' : 'vscode-dark'
        // O VS Code põe as variáveis --vscode-* no <html> e a classe do tema no <body>.
        document.documentElement.classList.add(classe)
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add(classe)
          var largura = p.get('largura') || (view === 'painel' ? '300' : '')
          if (largura) {
            document.documentElement.classList.add('mz-dev-moldura')
            document.body.style.maxWidth = largura + 'px'
          }
        })
      })()
    </script>
    <link rel="stylesheet" href="../dist/webview.css" />
  </head>
  <body>
    <div id="raiz"></div>
    <script src="../dist/webview.js"></script>
  </body>
</html>
